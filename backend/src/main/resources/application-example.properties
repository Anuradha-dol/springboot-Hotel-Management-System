spring.application.name=HMS

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hotelDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

aws.s3.access.key=your_aws_access_key
aws.s3.secret.key=your_aws_secret_key

# Keep real local values in application.properties or environment variables.
# JWTUtils currently defines the JWT signing secret in code, so move that value
# to external configuration before using this project outside local development.
